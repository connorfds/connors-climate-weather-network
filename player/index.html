<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Connor's Climate Console Player</title>
    <style>
      html,
      body,
      #player {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }

      .message {
        box-sizing: border-box;
        display: grid;
        place-items: center;
        min-height: 100%;
        padding: 2rem;
        color: #d9f7ff;
        font: 600 18px/1.4 system-ui, sans-serif;
        text-align: center;
        background: #020d14;
      }
    </style>
  </head>
  <body>
    <main id="player" aria-label="Live camera player"></main>
    <script>
      const mount = document.querySelector("#player");
      const videoId = new URLSearchParams(location.search).get("v") || "";

      if (!/^[A-Za-z0-9_-]{11}$/.test(videoId)) {
        mount.innerHTML =
          '<div class="message">Choose a camera in Connor&#39;s Climate Console.</div>';
      } else {
        const player = document.createElement("iframe");
        player.title = "Live camera video";
        player.allow =
          "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
        player.allowFullscreen = true;
        player.referrerPolicy = "strict-origin-when-cross-origin";
        player.src =
          "https://www.youtube-nocookie.com/embed/" +
          encodeURIComponent(videoId) +
          "?autoplay=1&mute=1&playsinline=1&rel=0";
        mount.append(player);
      }
    </script>
  </body>
</html>
